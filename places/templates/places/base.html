<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Explore Anuradhapura{% endblock %}</title>
    {% load static %}
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sand: '#f6ecdc',
                        terracotta: {
                            50: '#faf4f0',
                            100: '#f3e2d8',
                            200: '#e5c0ab',
                            300: '#d69a7a',
                            400: '#c67449',
                            500: '#b85f35',
                            600: '#af5a2e',
                            700: '#9a4e28',
                            800: '#854222',
                            900: '#70361c'
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="{% static 'places/js/plan.js' %}"></script>
    <script>
        function toggleMenu() {
            const menu = document.getElementById('mobile-menu');
            const openIcon = document.getElementById('menu-icon-open');
            const closeIcon = document.getElementById('menu-icon-close');
            menu.classList.toggle('hidden');
            openIcon.classList.toggle('hidden');
            closeIcon.classList.toggle('hidden');
        }
        function closeMenu() {
            document.getElementById('mobile-menu').classList.add('hidden');
            document.getElementById('menu-icon-open').classList.remove('hidden');
            document.getElementById('menu-icon-close').classList.add('hidden');
        }
    </script>

    <style>
        .leaflet-container {
            position: relative;
            z-index: 0;
        }
    </style>
</head>
<body class="bg-stone-50 text-stone-900 font-sans antialiased min-h-screen flex flex-col">

    <!-- ===== NAVIGATION ===== -->
    <nav class="bg-sand border-b border-stone-200 sticky top-0 z-50">
        <div class="mx-auto max-w-6xl px-4 py-4 flex items-center justify-between">
            <a href="/" class="flex items-center">
                <img src="{% static 'places/images/explore-anuradhapura.png' %}" alt="Explore Anuradhapura" class="h-10 w-auto">
            </a>

            <div class="hidden lg:flex gap-6 text-sm font-medium text-stone-600">
                <a href="/#places" class="flex items-center gap-2 hover:text-terracotta-600 transition">
                    <i data-lucide="compass" class="w-4 h-4"></i>Places
                </a>
                <a href="/map" class="flex items-center gap-2 hover:text-terracotta-600 transition">
                    <i data-lucide="map" class="w-4 h-4"></i>Map
                </a>
                <a href="/my-day" class="flex items-center gap-2 hover:text-terracotta-600 transition">
                    <i data-lucide="route" class="w-4 h-4"></i>My day
                </a>
            </div>

            <button id="menu-btn" onclick="toggleMenu()" class="lg:hidden p-2 text-stone-700" aria-label="Toggle menu">
                <i data-lucide="menu" class="w-6 h-6" id="menu-icon-open"></i>
                <i data-lucide="x" class="w-6 h-6 hidden" id="menu-icon-close"></i>
            </button>
        </div>

        <div id="mobile-menu" class="hidden lg:hidden border-t border-stone-200 bg-sand">
            <div class="mx-auto max-w-6xl px-4 py-3 flex flex-col gap-1 text-sm font-medium text-stone-700">
                <a href="/#places" onclick="closeMenu()" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/60 transition">
                    <i data-lucide="compass" class="w-4 h-4"></i>Places
                </a>
                <a href="/map" onclick="closeMenu()" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/60 transition">
                    <i data-lucide="map" class="w-4 h-4"></i>Map
                </a>
                <a href="/my-day" onclick="closeMenu()" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/60 transition">
                    <i data-lucide="route" class="w-4 h-4"></i>My day
                </a>
            </div>
        </div>
    </nav>

    <!-- ===== PAGE CONTENT ===== -->
    <main class="flex-1">
        {% block content %}{% endblock %}
    </main>
    <!-- ===== PAGE CONTENT END ===== -->

    <!-- ===== FOOTER ===== -->
    <footer class="bg-sand border-t border-stone-200 mt-16">
        <div class="mx-auto max-w-6xl px-4 py-6 text-sm text-stone-600 text-center">
            <p>&copy; 2026 Explore Anuradhapura</p>
        </div>
    </footer>

    <!-- ===== LUCIDE ICONS INIT ===== -->
    <script>lucide.createIcons();</script>

</body>
</html>
